name: Build & Release Installer

# Startet, wenn du einen Tag wie v1.0.0 pushst oder ein Release in GitHub anlegst.
# Zusätzlich manuell startbar: Actions -> Build & Release Installer -> Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# ---------- HIER ANPASSEN ----------
env:
  ENTRY_FILE: ollama_model_installer.py
  APP_NAME: Ollama-Installer
  PYTHON_VERSION: "3.11"
  ICON_ICO: ollama_model_installer_icon.ico
  ICON_PNG: ollama_model_installer_icon.png
  ICON_PNG_256: ollama_model_installer_icon_256.png
# -----------------------------------

jobs:
  # ------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Startdatei und Icons prüfen
        shell: bash
        run: |
          for f in "$ENTRY_FILE" "$ICON_ICO" "$ICON_PNG" "$ICON_PNG_256"; do
            test -f "$f" || { echo "::error::Datei fehlt im Repo-Hauptordner: $f"; exit 1; }
          done

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: EXE bauen
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          pyinstaller --onefile --windowed --noconfirm \
            --name "Ollama-Installer-Win" \
            --icon "$ICON_ICO" \
            --add-data "$ICON_ICO;." \
            --add-data "$ICON_PNG;." \
            --add-data "$ICON_PNG_256;." \
            "$ENTRY_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/Ollama-Installer-Win.exe
          if-no-files-found: error

  # ------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Startdatei und Icons prüfen
        shell: bash
        run: |
          for f in "$ENTRY_FILE" "$ICON_ICO" "$ICON_PNG" "$ICON_PNG_256"; do
            test -f "$f" || { echo "::error::Datei fehlt im Repo-Hauptordner: $f"; exit 1; }
          done

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Pillow wandelt das PNG-Icon für PyInstaller automatisch in .icns um
          pip install pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: App bauen
        shell: bash
        run: |
          pyinstaller --windowed --noconfirm \
            --name "$APP_NAME" \
            --icon "$ICON_PNG_256" \
            --add-data "$ICON_ICO:." \
            --add-data "$ICON_PNG:." \
            --add-data "$ICON_PNG_256:." \
            "$ENTRY_FILE"

      - name: DMG erstellen
        shell: bash
        run: |
          hdiutil create -volname "Ollama Installer" \
            -srcfolder "dist/$APP_NAME.app" \
            -ov -format UDZO "Ollama-Installer-Mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: Ollama-Installer-Mac.dmg
          if-no-files-found: error

  # ------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Startdatei und Icons prüfen
        run: |
          for f in "$ENTRY_FILE" "$ICON_ICO" "$ICON_PNG" "$ICON_PNG_256"; do
            test -f "$f" || { echo "::error::Datei fehlt im Repo-Hauptordner: $f"; exit 1; }
          done

      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libdbus-1-3

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Binary bauen
        run: |
          pyinstaller --onefile --noconfirm \
            --name "$APP_NAME" \
            --add-data "$ICON_ICO:." \
            --add-data "$ICON_PNG:." \
            --add-data "$ICON_PNG_256:." \
            "$ENTRY_FILE"

      - name: AppImage zusammenstellen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp "dist/$APP_NAME" "AppDir/usr/bin/$APP_NAME"

          # Icon für Startmenü und Dateimanager
          cp "$ICON_PNG_256" AppDir/ollama-installer.png
          cp "$ICON_PNG_256" AppDir/.DirIcon

          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$APP_NAME" "\$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/ollama-installer.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Ollama Installer
          Exec=$APP_NAME
          Icon=ollama-installer
          Categories=Utility;
          EOF

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir Ollama-Installer-Linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: Ollama-Installer-Linux.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------
  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-files

      - name: Dateien anzeigen
        run: ls -lh release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
